{{ define "main" }}
<content>
  {{ .Content }}
  <ul class="blog-posts">
    {{ range (where .Site.RegularPages "Section" "posts").ByDate.Reverse }}
    <li>
      <span>
        <i>
          <time datetime='{{ .Date.Format "2006-01-02" }}' pubdate>
            {{ .Date.Format "2006-01-02" }}
          </time>
        </i>
      </span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</content>
{{ end }}
