# SINGLE SOURCE OF TRUTH for deployment URL.
# This is the only value that needs to change when switching hosts.
# If the site lives at a subpath (e.g. /technical-notes/), include it here.
# If the site lives at the root of a domain, use "https://yourdomain.com/".
# The figure shortcode and absURL calls read this value dynamically — no
# other files need to be touched when this changes.
# To keep this file host-agnostic, set baseURL = "/" here and pass the real
# URL at build time: hugo --minify --baseURL "https://..."
baseURL = "https://leviyevalex.github.io/technical-notes/"
locale = "en-us"
title = "Technical Notes"
copyright = "© 2026 Alex Leviyev"
theme = "hugo-bearcub"

[[menus.main]]
  name   = "Home"
  url    = "/"
  weight = 1

[[menus.main]]
  name   = "Posts"
  url    = "/posts/"
  weight = 2

[params]
  showHeader = true  # set to false to hide the site header
  description = "Notes on mathematics, algorithms, and quantitative finance."
  favicon = ""
  [params.author]
    name  = "Alex Leviyev"
    email = "leviyevalex@gmail.com"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "monokai"

[minify]
  disableHTML = true
